# Round 1 — dataset ablation (manual / CVAT labels).
# Fixed train protocol = PoC schedule: YOLO11s, staged head-then-backbone, --prototype.
# Vary only the train pack. Score every run on native + scale-adapted eval packs.
#
# Prereq (once):
#   python src/labeling/cvat/cvat_pull.py --verify --sync-labels
#   python src/training/prepare_eval.py
#   python src/training/prepare_eval.py --scale-adapt
#
# Run (no flags = full round from scratch):
#   python src/training/experiments/run_dataset_round.py
#   python src/training/experiments/run_dataset_round.py --resume
#   python src/training/experiments/run_dataset_round.py --variant baseline_1

defaults:
  model: yolo11s.pt
  imgsz: 1024
  warmup_epochs: 2   # Stage 1: head only, backbone frozen (freeze=11)
  epochs: 5          # Stage 2: full model, backbone unfrozen
  freeze: 11
  lr0: 0.01
  patience: 3
  seed: 42
  train_augmentation: poc
  labels_root: labels
  datasets_root: data/datasets
  runs_dir: outputs/experiments/dataset_round
  eval_targets:
    - gt: manual
      pack: data/datasets/eval_manual
    - gt: manual_adapted
      pack: data/datasets/eval_manual_adapted

# Order = run order. Each id must exist in config/datasets/variants.yaml
runs:
  - baseline_1
  - variant_2_no_tiling
  - variant_3_tiling_fixed
  - variant_4_low_overlap
  - variant_5_aug
  - variant_6_strided
  - variant_7_negatives
