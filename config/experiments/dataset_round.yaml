# Round 2 — dataset pack ablation (manual / CVAT labels).
# Fixed train protocol = 2+5 YOLO11s. Fixed imgsz = Round 1 winner (default 640).
# Prereq: Round 1 done (or accept default imgsz 640 on auto).
#
# Prereq (once):
#   python src/labeling/cvat/cvat_pull.py --verify --sync-labels
#   python src/training/prepare_eval.py
#
# Run (no flags = full round from scratch):
#   python src/training/experiments/run_dataset_round.py
#   python src/training/experiments/run_dataset_round.py --resume
#   python src/training/experiments/run_dataset_round.py --variant auto

defaults:
  model: yolo11s.pt
  imgsz: 1280   # Round 1 winner (auto pack)
  warmup_epochs: 2   # Stage 1: head only, backbone frozen (freeze=11)
  epochs: 5          # Stage 2: full model, backbone unfrozen
  freeze: 11
  lr0: 0.01
  patience: 3
  seed: 42
  train_augmentation: poc
  labels_root: labels
  datasets_root: data/datasets
  runs_dir: outputs/experiments/dataset_round
  eval_targets:
    - gt: manual
      pack: data/datasets/eval_manual

# Order = run order. Pack recipe only — imgsz is Round 1, not varied here.
runs:
  - auto
  - fullframe
  - strided
  - fullframe_strided
  - strided_negatives
  - strided_clip_balanced
