# Round 2 — train setup on the Round 1 pack (protocol → family → size → epochs).
#
# One factor per group. No LR grid (optimizer=auto often ignores lr0).
# Decision: native mAP@0.5, mean of bands A and B.
#
#   python src/training/experiments/run_model_round.py --all
#   python src/training/experiments/run_model_round.py --all --resume
#   python src/training/experiments/run_model_round.py --pick-winner
#   python src/training/experiments/run_model_round.py --group F --winner PROTO

defaults:
  dataset: strided_imgsz768
  datasets_root: data/datasets
  model: yolo11s.pt
  imgsz: 768
  lr0: 0.01
  patience: 7
  seed: 42
  train_augmentation: poc
  labels_root: labels
  eval_targets:
    - gt: manual
      pack: data/datasets/eval_manual
  runs_dir: outputs/experiments/model_round
  winner_delta: 0.015
  decision_metric: map50

# n = too-small control, s = current default, m = extra capacity. No l/x on this n.
size_letters: [n, s, m]

# Epoch curve after size is locked. Frozen: total head-only epochs.
# Staged unfreeze: Stage-2 lengths (warmup copied from the winner).
epoch_curve_frozen: [5, 10, 20]
epoch_curve_unfreeze: [5, 10, 15]

groups:
  P:
    description: "Protocol on YOLO11s — freeze vs short unfreeze vs long unfreeze"
    runs:
      - proto_frozen_e20
      - proto_short_2p5
      - proto_unfreeze_5p15
  F:
    description: "Family — YOLOv8s vs YOLO11s, protocol copied from --winner"
    runs: []
  S:
    description: "Size letter n/s/m on the winning family + protocol"
    runs: []
  E:
    description: "Epoch curve on the winning size (patience off so runs actually reach N)"
    runs: []

variants:
  proto_frozen_e20:
    group: P
    description: "YOLO11s, COCO backbone frozen, head 20 ep"
    model: yolo11s.pt
    warmup_epochs: 0
    epochs: 20
    freeze: 11
    staged: false
    train_backbone: false
  proto_short_2p5:
    group: P
    description: "YOLO11s, Round 1 recipe — 2 ep freeze + 5 ep unfreeze"
    model: yolo11s.pt
    warmup_epochs: 2
    epochs: 5
    freeze: 11
    staged: true
    train_backbone: true
  proto_unfreeze_5p15:
    group: P
    description: "YOLO11s, long unfreeze — 5 ep freeze + 15 ep backbone"
    model: yolo11s.pt
    warmup_epochs: 5
    epochs: 15
    freeze: 11
    staged: true
    train_backbone: true
