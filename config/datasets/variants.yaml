# Dataset pack variants (local blobs under data/datasets/ — not git).
# Settings in this file ARE git-tracked.
#
# Manual-label defaults: CVAT labels/, frame_step, imgsz 640 (Ultralytics default).
# Train protocol (yolo11s --prototype) lives in config/experiments/dataset_round.yaml.
#
#   python src/training/datasets/generate_variant.py --list
#   python src/training/datasets/generate_variant.py --all

auto:
  source: "config/clip_tiling.json train_groups"
  tile_size: 1024
  overlap: 0.2
  by_group:
    A_close:
      tile_size: null
      overlap: 0.0
      train_imgsz: 640
    B_medium:
      tile_size: 1024
      overlap: 0.2
      train_imgsz: 640
    C_far:
      tile_size: 768
      overlap: 0.2
      train_imgsz: 640

defaults:
  imgsz: 640
  val_fraction: 0.15
  seed: 42
  min_visible_ratio: 0.3
  keep_negative_tiles: false
  frame_step_only: true
  labels_root: labels
  out_root: data/datasets
  # Online aug at train time (dataset_round). Tiles on disk are never augmented.
  train_augmentation: poc

# Round 2 ablation packs. Names are the recipe, not a count.
# Tiling {auto, off} × sampling {full, strided}, empty tiles, clip balance.
# imgsz is Round 1 (config/experiments/imgsz_round.yaml), not a pack variant.
variants:
  auto:
    description: "Reference — AUTO tiling, every frame_step frame, drop empty tiles"
    dataset: build
    tiling:
      mode: auto
      min_visible_ratio: 0.3
      keep_negative_tiles: false
    sampling:
      strategy: full

  fullframe:
    description: "Full frame only; letterbox to imgsz at train time"
    dataset: build
    tiling:
      mode: "off"   # quoted — bare `off` parses as YAML boolean false → auto
      min_visible_ratio: 0.3
      keep_negative_tiles: false
    sampling:
      strategy: full

  strided:
    description: "AUTO tiling; keep every 5th frame_step frame per clip"
    dataset: build
    tiling:
      mode: auto
      min_visible_ratio: 0.3
      keep_negative_tiles: false
    sampling:
      strategy: strided
      stride: 5

  fullframe_strided:
    description: "No tiling + every 5th frame — tiling × time factorial cell"
    dataset: build
    tiling:
      mode: "off"
      min_visible_ratio: 0.3
      keep_negative_tiles: false
    sampling:
      strategy: strided
      stride: 5

  strided_negatives:
    description: "Stride 5 + empty tiles at 15% of positives — FA lever on the find-the-car pack"
    dataset: build
    tiling:
      mode: auto
      min_visible_ratio: 0.3
      keep_negative_tiles: true
      negative_ratio: 0.15
    sampling:
      strategy: strided
      stride: 5

  strided_clip_balanced:
    description: "Stride 5, then cap each clip to the median clip's frame count"
    dataset: build
    tiling:
      mode: auto
      min_visible_ratio: 0.3
      keep_negative_tiles: false
    sampling:
      strategy: clip_balanced
      stride: 5
