# Hyperparams / baseline prepare defaults.
# Training CLI flags in src/training/train.py remain the source of truth at runtime.

prepare:
  val_fraction: 0.15
  seed: 42

# Versioned baseline prepare defaults (local data/datasets/ only).
# GT:     python src/training/prepare_baseline.py
# Pseudo: python src/training/prepare_baseline.py --from-autolabel  → baseline_v0
baseline:
  name: baseline_v1
  out_dir: data/datasets/baseline_v1
  imgsz: 1024
  val_fraction: 0.15
  seed: 42
  frame_step_only: true
  balance: false
  empty_slices_per_frame: 0

# Ablation packs: config/datasets/variants.yaml
#   python src/training/datasets/generate_variant.py --all
# Round 1 (datasets, yolo11s --prototype, CVAT labels):
#   python src/training/experiments/run_dataset_round.py
# Round 2 (models, later):
#   python src/training/experiments/run_model_round.py --dry-run
experiment:
  model: yolo11s.pt
  imgsz: 1024
  warmup_epochs: 2
  epochs: 5
  freeze: 11
  patience: 3
  lr0: 0.01

train:
  model: yolo11s.pt
  warmup_epochs: 5
  epochs: 20
  freeze: 11
  lr0: 0.01
  patience: 10
  imgsz: 1024
  seed: 42
